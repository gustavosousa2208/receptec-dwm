# The fake COLETEC responders use the J-Link VCP UART as their only shell
# transport. The fixed-anchor image has a separate RECEPTEC configuration and
# intentionally keeps RTT for management.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
