CONFIG_RECEPTEC_UWB_RADIO=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="rtt-receptec-qorvo:~$ "
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# BLE GATT range dashboard (bench): this board is the only RECEPTEC with a
# radio-facing role that publishes results. Peripheral with one connection,
# open (no bonding) — bench only.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="ATL-RANGE"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_LL_SW_SPLIT=y
