#
# OTA Fase 1 (atletec-64a.2): app-side SMP over UART on fake-coletec-0.
# The serial shell backend is off so mcumgr owns uart0; observability for
# the pilot goes through mcumgr (echo / image states / versions).
# Shell registration still compiles (SHELL stays y, no backend attached).

CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_ZCBOR=y
