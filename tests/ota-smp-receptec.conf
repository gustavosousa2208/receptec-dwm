#
# OTA Fase 4 (atletec-64a.5): app-side SMP for RECEPTEC-app boards
# (receptec-qorvo MASTER, receptec-qorvo-anchor BASE A). BLE stack already
# present via receptec_qorvo.conf; this only adds image management.
# No UART transport here: shell is RTT, uart0 is the Pi header.

CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_ZCBOR=y
