# P-11 accelerated soak: 1,000 consecutive DATA_REQ/DATA transactions with the
# DWM surrogate. Build both roles with this fragment
# (scripts/build-both.sh --test-conf tests/p11-soak.conf) so they share the
# shortened sampling period, then restore a normal build afterwards.
#
# Only slot 0 (the DWM surrogate) is polled: the production COLETEC is built for
# the normal 1 s period and must not be polled at 200 ms. Autostart is left off so
# the COLETEC can be started first with `uwb coletec start`, then the RECEPTEC with
# `uwb slotted start`.
CONFIG_RECEPTEC_TEST_SAMPLING_PERIOD_MS=200
CONFIG_RECEPTEC_TEST_POLL_PEER_MASK=1
