#
# Fase 0 (atletec-64a.1): size-measurement only. Adds BLE + mcumgr SMP image
# management to fake-coletec-0 to weigh growth against the fixed partition
# slots (image-0 224KB / image-1 216KB). No sysbuild/MCUboot yet, no flash.
# NOT for deployment: no BT init/advertise code in the app yet.

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="ATL-OTA-SIZE"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_LL_SW_SPLIT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_ZCBOR=y
