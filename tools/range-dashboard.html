<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLETEC Range</title>
<style>
:root {
  --bg: #1a1a2e; --card: #16213e; --accent: #0f3460;
  --blue: #4da6ff; --green: #4caf50; --red: #f44336;
  --dim: #888; --text: #e0e0e0; --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: 20px; max-width: 560px; margin: 0 auto;
}
.conn-bar {
  background: var(--accent); padding: 12px 16px; display: flex;
  align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.conn-bar .status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--red); flex-shrink: 0;
}
.conn-bar .status-dot.connected { background: var(--green); }
.conn-bar .device-name { font-weight: 600; font-size: 15px; }
.conn-bar .device-info { color: var(--dim); font-size: 12px; }
.conn-bar .spacer { flex: 1; }
#btnConnect {
  background: var(--blue); color: #fff; border: none; padding: 8px 20px;
  border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
}
#btnConnect:hover { opacity: 0.85; }
#btnConnect.disconnect { background: var(--red); }
.card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin: 12px;
}
.card h3 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--dim); margin-bottom: 12px;
}
.metric-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.metric { background: var(--accent); border-radius: 8px; padding: 10px 12px; }
.metric .label { font-size: 11px; color: var(--dim); }
.metric .value { font-size: 20px; font-weight: 700; margin-top: 2px;
  font-variant-numeric: tabular-nums; }
.metric .value.stale { color: var(--dim); }
.metric .unit { font-size: 12px; color: var(--dim); font-weight: 400; }
.metric .age { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>

<div class="conn-bar">
  <div class="status-dot" id="statusDot"></div>
  <div>
    <div class="device-name" id="deviceName">ATL-RANGE</div>
    <div class="device-info" id="deviceInfo">Not connected</div>
  </div>
  <div class="spacer"></div>
  <button id="btnConnect" onclick="toggleConnection()">Connect</button>
</div>

<div class="card">
  <h3>UWB range (master)</h3>
  <div class="metric-grid">
    <div class="metric"><div class="label">M–T</div><div class="value stale" id="d0">—</div><div class="age" id="a0"></div></div>
    <div class="metric"><div class="label">A–T</div><div class="value stale" id="d1">—</div><div class="age" id="a1"></div></div>
    <div class="metric"><div class="label">M–A</div><div class="value stale" id="d2">—</div><div class="age" id="a2"></div></div>
  </div>
</div>
<div class="card">
  <h3>Browser check</h3>
  <div style="font-size:12px;color:var(--dim)" id="diag">…</div>
</div>

<script>
// Same 128-bit scheme as the COLETEC dashboard:
// 0000xxxx-4550-5453-4154-4c4554454300.
const UUID_BASE = '-4550-5453-4154-4c4554454300';
const uuid = (short) => '0000' + short.toString(16).padStart(4, '0') + UUID_BASE;
const SVC_RANGE = uuid(0x3100);
const CHR_METADATA = uuid(0x3104);
const CHR_RANGE = [uuid(0x3101), uuid(0x3102), uuid(0x3103)];

let device = null;
let server = null;
const records = [null, null, null];
let metadataMode = false;

(async () => {
  const ua = navigator.userAgent || '';
  const chrome = /Chrome\//.test(ua) && !/Edg\//.test(ua);
  const edge = /Edg\//.test(ua);
  let radio = 'unknown';
  if (navigator.bluetooth && navigator.bluetooth.getAvailability) {
    try { radio = (await navigator.bluetooth.getAvailability()) ? 'on' : 'off'; }
    catch (_) { radio = 'query failed'; }
  }
  document.getElementById('diag').textContent =
    'page: ' + location.protocol + '//' + location.host +
    ' | browser: ' + (chrome ? 'Chrome' : edge ? 'Edge' : 'other') +
    ' | WebBT API: ' + (navigator.bluetooth ? 'present' : 'MISSING') +
    ' | BT radio: ' + radio;
})();

// Web Bluetooth expects GATT access to be serialized: every operation goes
// through this single chain so CCCD writes never overlap.
let gattChain = Promise.resolve();
function gattOp(fn) {
  const run = gattChain.then(fn, fn);
  gattChain = run.catch(() => {});
  return run;
}

function render(i) {
  const record = records[i];
  const el = document.getElementById('d' + i);
  const detail = document.getElementById('a' + i);
  if (!record) {
    el.textContent = '—';
    el.classList.add('stale');
    detail.textContent = 'No sample';
    return;
  }
  const age = record.age === null ? null : record.age + Math.max(0, performance.now() - record.received);
  const valid = record.status === 0 && record.mm !== 0xFFFFFFFF && record.source !== 2;
  const stale = age === null || age > 3000;
  if (valid) el.innerHTML = (record.mm / 1000).toFixed(3) + '<span class="unit"> m</span>';
  else el.textContent = '—';
  el.classList.toggle('stale', !valid || stale);
  if (record.source === 2) {
    detail.textContent = record.round !== '0' ?
      'Unavailable · round ' + record.round + ' · failed (status ' + record.status + ')' :
      'No sample';
    return;
  }
  const source = record.source === 1 ? 'Constant' : record.source === 0 ? 'Measured' : 'Legacy: source unknown';
  const round = record.round === null ? 'round unavailable' : 'round ' + record.round;
  const timing = age === null ? 'age unknown' : (age / 1000).toFixed(1) + 's old' + (stale ? ' · expired' : '');
  detail.textContent = source + ' · ' + round + ' · ' + timing +
    (valid ? '' : ' · failed (status ' + record.status + ')');
}

setInterval(() => { for (let i = 0; i < 3; i++) render(i); }, 250);

function showLegacy(i, value, initial) {
  if (value.byteLength !== 5) return;
  records[i] = {status: value.getUint8(0), mm: value.getUint32(1, true),
    source: null, round: null, age: initial ? null : 0, received: performance.now()};
  render(i);
}

function showMetadata(value) {
  if (value.byteLength !== 20 && value.byteLength !== 60) return;
  for (let offset = 0; offset < value.byteLength; offset += 20) {
    const i = value.getUint8(offset + 1);
    if (value.getUint8(offset) !== 1 || i >= 3 || value.getUint8(offset + 2) > 2) continue;
    const rawAge = value.getUint32(offset + 16, true);
    // Preserve the full 64-bit round as decimal text, without Number rounding.
    const round = (BigInt(value.getUint32(offset + 8, true)) << 32n) |
                  BigInt(value.getUint32(offset + 4, true));
    records[i] = {source: value.getUint8(offset + 2), status: value.getUint8(offset + 3),
      round: round.toString(), mm: value.getUint32(offset + 12, true),
      age: rawAge === 0xFFFFFFFF ? null : rawAge, received: performance.now()};
    render(i);
  }
}

function setStatus(msg, connected) {
  document.getElementById('deviceInfo').textContent = msg;
  document.getElementById('statusDot').classList.toggle('connected', !!connected);
  if (device) document.getElementById('deviceName').textContent = device.name || 'ATL-RANGE';
}

async function toggleConnection() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  if (!navigator.bluetooth) {
    const isFile = location.protocol === 'file:';
    alert(
      'Web Bluetooth is not available.\n\n' +
      (isFile
        ? 'This page was opened via file:// — Web Bluetooth requires a secure context.\n\nServe it from localhost instead:\n  python3 -m http.server 8000\nThen open http://localhost:8000/range-dashboard.html'
        : 'Use Chrome/Chromium over HTTPS or localhost with Bluetooth enabled.')
    );
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'ATL' }],
      optionalServices: [SVC_RANGE],
    });
    device.removeEventListener('gattserverdisconnected', onDisconnected);
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus('Connecting...');
    server = await device.gatt.connect();
    setStatus('Connected', true);
    document.getElementById('btnConnect').textContent = 'Disconnect';
    document.getElementById('btnConnect').classList.add('disconnect');
    await gattOp(async () => {
      const svc = await server.getPrimaryService(SVC_RANGE);
      let metadata = null;
      try { metadata = await svc.getCharacteristic(CHR_METADATA); }
      catch (error) {
        if (error.name !== 'NotFoundError') throw error;
      }
      metadataMode = metadata !== null;
      records.fill(null);
      for (let i = 0; i < 3; i++) render(i);
      if (metadata) {
        metadata.addEventListener('characteristicvaluechanged', e => showMetadata(e.target.value));
        await metadata.startNotifications();
        showMetadata(await metadata.readValue());
      } else {
        for (let i = 0; i < 3; i++) {
          const chr = await svc.getCharacteristic(CHR_RANGE[i]);
          showLegacy(i, await chr.readValue(), true);
          chr.addEventListener('characteristicvaluechanged', e => showLegacy(i, e.target.value, false));
          await chr.startNotifications();
        }
      }
    });
    setStatus((metadataMode ? 'Live — ' : 'Legacy: no round/source metadata — ') + (device.name || 'connected'), true);
  } catch (e) {
    console.error(e);
    setStatus('Error: ' + e.message);
  }
}

function onDisconnected() {
  setStatus('Disconnected');
  document.getElementById('btnConnect').textContent = 'Connect';
  document.getElementById('btnConnect').classList.remove('disconnect');
  document.getElementById('statusDot').classList.remove('connected');
  server = null;
}
</script>
</body>
</html>
