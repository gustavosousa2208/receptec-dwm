CONFIG_HWINFO=y

# Retransmission backoff jitter (protocol-v1.0 4.2) needs a random source.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_PROMPT_BUFF_SIZE=40
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n

# Remote UWB commissioning applies staged settings through a confirmed reboot.
CONFIG_REBOOT=y
